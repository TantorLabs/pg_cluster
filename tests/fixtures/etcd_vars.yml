# Fixture variables for etcd template rendering tests

etcd_user: etcd
etcd_group: etcd
etcd_data_dir: /opt/tantor/var/lib/etcd
etcd_master_group_name: inv_etcd
etcd_secure: true
etcd_bin_path: "/opt/tantor/usr/bin/etcdctl"
etcd_conf_dir: "/opt/tantor/var/lib/etcd/pg-cluster.pki"
etcd_pki_dir: "pki-dir/test_inventory"
etcd_pki_key_suffix: -key.pem
etcd_pki_cert_suffix: .pem
etcd_use_ips: true
etcd_iface_public: "all"
etcd_iface_cluster: "default"
etcd_port_client: 2379
etcd_port_peer: 2380
etcd_cluster_name: pg-cluster
etcd_initial_cluster_token: test-cluster-token-12345
etcd_init_system: systemd
etcd_launch: true
etcd_scheme: "https://"
etcd_cluster: "pg-node1=https://10.20.0.11:2380,pg-node2=https://10.20.0.12:2380,pg-node3=https://10.20.0.13:2380"
etcd_cluster_data_dir: "/opt/tantor/var/lib/etcd/pg-cluster.etcd"
etcd_cluster_pki_dir: "/opt/tantor/var/lib/etcd/pg-cluster.pki"
etcd_pki_key_file: "pg-node1-key.pem"
etcd_pki_key_src: "pki-dir/test_inventory/pg-node1-key.pem"
etcd_pki_key_dest: "/opt/tantor/var/lib/etcd/pg-cluster.pki/pg-node1-key.pem"
etcd_pki_cert_file: "pg-node1.pem"
etcd_pki_cert_src: "pki-dir/test_inventory/pg-node1.pem"
etcd_pki_cert_dest: "/opt/tantor/var/lib/etcd/pg-cluster.pki/pg-node1.pem"
etcd_pki_ca_file: "ca.pem"
etcd_pki_ca_cert_src: "pki-dir/test_inventory/ca.pem"
etcd_pki_ca_cert_dest: "/opt/tantor/var/lib/etcd/pg-cluster.pki/ca.pem"
