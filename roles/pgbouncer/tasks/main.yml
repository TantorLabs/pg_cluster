---
- name: Install pgbouncer-tantor-all (RHEL-like systems)
  when: ansible_facts.os_family in ["RED", "Centos", "Rocky", "RedHat"]
  ansible.builtin.dnf:
    name: >-
      {{
        'pgbouncer-tantor-all-' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present
    allow_downgrade: true

- name: Install pgbouncer-tantor-all (Alt linux)
  when: ansible_facts.os_family in ["Altlinux"]
  community.general.apt_rpm:
    name: >-
      {{
        'pgbouncer-tantor-all-' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present

- name: Install pgbouncer-tantor-all (Debian-like systems)
  when: ansible_facts.os_family in ["Astra Linux", "Debian"]
  ansible.builtin.apt:
    name: >-
      {{
        'pgbouncer-tantor-all=' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present
    allow_downgrade: true

- name: Create conf directory
  ansible.builtin.file:
    path: "/opt/tantor/etc/pgbouncer"
    state: directory
    owner: "postgres"
    group: "postgres"
    mode: "0755"

- name: Write pgbouncer.ini
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /opt/tantor/etc/pgbouncer/pgbouncer.ini
    backup: true
    owner: "postgres"
    group: "postgres"
    mode: "0755"
  notify: Restart pgbouncer-tantor

- name: Create log and pid directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "postgres"
    group: "postgres"
    mode: "0755"
  with_items:
    - "/opt/tantor/var/log/pgbouncer"
    - "/var/run/pgbouncer-tantor"
  notify: Restart pgbouncer-tantor

- name: Check if postgresql node is in master state
  ansible.builtin.command:
    cmd: su - postgres -s /bin/bash -c "psql -A -t -d postgres -c \"SELECT pg_is_in_recovery();\""
  changed_when: false
  register: pgbouncer_psql_node_status

- name: Create pgbouncer role
  vars:
    ansible_python_interpreter: "/opt/tantor/usr/bin/python3"
  community.postgresql.postgresql_user:
    login_host: 127.0.0.1
    login_user: "{{ patroni_superuser_username }}"
    login_password: "{{ patroni_superuser_password }}"
    login_db: postgres
    name: "{{ pgbouncer_auth_user }}"
    password: "{{ pgbouncer_auth_user_passw }}"
    encrypted: true
    role_attr_flags: REPLICATION
    state: present
    login_port: "{{ patroni_pg_port }}"
  become: true
  become_user: postgres
  when: pgbouncer_psql_node_status.stdout == 'f'

# The auth_user password has to be stored in plain text. PgBouncer opens its
# own backend connection to run auth_query, and a SCRAM secret copied from
# pg_shadow.passwd cannot be used for that login: a SCRAM secret can only be
# passed through from an authenticated client, and the internal auth_query
# connection has no client. With a SCRAM secret there PgBouncer fails with
# "failed to answer authreq" and every client login dies with
# "server login has been failing, cached error: failed to answer authreq".
# Client users are still resolved through auth_query and use SCRAM
# pass-through, so only the auth_user needs a plain-text entry here.
- name: Write PgBouncer userlist with the plain-text auth user password
  ansible.builtin.copy:
    content: |
      "{{ pgbouncer_auth_user }}" "{{ pgbouncer_auth_user_passw }}"
    dest: /opt/tantor/etc/pgbouncer/userlist.txt
    owner: "postgres"
    group: "postgres"
    mode: "0600"
  no_log: true
  notify: Restart pgbouncer-tantor

- name: Upload pgbouncer_prepare.sql
  become: true
  become_user: root
  with_items:
    - f: "{{ playbook_dir + '/roles/pgbouncer/sql/pgbouncer_prepare.sql' }}"
      d: '/opt/tantor/etc/pgbouncer'
      m: '0400'
  ansible.builtin.copy:
    src: '{{ item.f }}'
    dest: '{{ item.d }}'
    owner: "postgres"
    group: postgres
    mode: '{{ item.m }}'

- name: Create pgbouncer namespace
  vars:
    ansible_python_interpreter: "/opt/tantor/usr/bin/python3"
  community.postgresql.postgresql_script:
    login_db: postgres
    path: /opt/tantor/etc/pgbouncer/pgbouncer_prepare.sql
  changed_when: false
  when: pgbouncer_psql_node_status.stdout == 'f'

- name: Create pgbouncer unit file
  ansible.builtin.template:
    src: pgbouncer.service.j2
    dest: /etc/systemd/system/pgbouncer-tantor.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart pgbouncer-tantor

- name: Override tmpfiles.d configuration for pgbouncer-tantor
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/pgbouncer-tantor.conf
    content: |
      d /run/pgbouncer-tantor 0755 postgres postgres -
    owner: root
    group: root
    mode: '0644'
  register: pgbouncer_override
  notify: Restart pgbouncer-tantor
