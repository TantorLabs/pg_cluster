---
- name: Install pgbouncer-tantor-all (RHEL-like systems)
  when: ansible_os_family in ["RED", "Centos", "Rocky", "RedHat"]
  ansible.builtin.dnf:
    name: >-
      {{
        'pgbouncer-tantor-all-' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present
    allow_downgrade: true

- name: Install pgbouncer-tantor-all (Alt linux)
  when: ansible_os_family in ["Altlinux"]
  community.general.apt_rpm:
    name: >-
      {{
        'pgbouncer-tantor-all-' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present

- name: Install pgbouncer-tantor-all (Debian-like systems)
  when: ansible_os_family in ["Astra Linux", "Debian"]
  ansible.builtin.apt:
    name: >-
      {{
        'pgbouncer-tantor-all=' + pgbouncer_package_version
        if pgbouncer_package_version | length > 0
        else
        'pgbouncer-tantor-all'
      }}
    state: present
    allow_downgrade: true

- name: Install pgbouncer-tantor-all (MosOS)
  when: ansible_pkg_mgr == 'zypper'
  community.general.zypper:
    name: >-
      {{ 'pgbouncer-tantor-all-' ~ pgbouncer_package_version
         if pgbouncer_package_version | length > 0
         else 'pgbouncer-tantor-all' }}
    state: present
    force_resolution: true

- name: Create conf directory
  ansible.builtin.file:
    path: "/opt/tantor/etc/pgbouncer"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Write pgbouncer.ini
  ansible.builtin.template:
    src: pgbouncer.ini.j2
    dest: /opt/tantor/etc/pgbouncer/pgbouncer.ini
    backup: true
    owner: "pgbouncer"
    group: "pgbouncer"
    mode: "0600"
  notify: Restart pgbouncer-tantor

- name: Create PgBouncer log directory
  ansible.builtin.file:
    path: "/opt/tantor/var/log/pgbouncer"
    state: directory
    owner: "pgbouncer"
    group: "pgbouncer"
    mode: "0700"
  notify: Restart pgbouncer-tantor

- name: Create PgBouncer PID directory
  ansible.builtin.file:
    path: "/var/run/pgbouncer-tantor"
    state: directory
    owner: "pgbouncer"
    group: "pgbouncer"
    mode: "0755"
  notify: Restart pgbouncer-tantor

- name: Check if postgresql node is in master state
  ansible.builtin.command:
    cmd: su - postgres -s /bin/bash -c "psql -A -t -d postgres -c \"SELECT pg_is_in_recovery();\""
  changed_when: false
  register: pgbouncer_psql_node_status

- name: Create pgbouncer role
  vars:
    ansible_python_interpreter: "/opt/tantor/usr/bin/python3"
  community.postgresql.postgresql_user:
    login_host: 127.0.0.1
    db: postgres
    name: "{{ pgbouncer_auth_user }}"
    password: "{{ pgbouncer_auth_user_passw }}"
    encrypted: true
    role_attr_flags: REPLICATION
    state: present
    port: "5432"
  become: true
  become_user: postgres
  when: pgbouncer_psql_node_status.stdout == 'f'

- name: Read current PgBouncer authentication data
  vars:
    ansible_python_interpreter: "/opt/tantor/usr/bin/python3"
  community.postgresql.postgresql_query:
    login_db: postgres
    query: >-
      SELECT usename, passwd
      FROM pg_catalog.pg_shadow
      WHERE usename = %(pgbouncer_username)s
    named_args:
      pgbouncer_username: "{{ pgbouncer_auth_user }}"
  become: true
  become_user: postgres
  register: pgbouncer_auth_data
  changed_when: false
  no_log: true

- name: Validate PgBouncer authentication data
  ansible.builtin.assert:
    that:
      - pgbouncer_auth_data.query_result | length == 1
      - pgbouncer_auth_data.query_result[0].usename == pgbouncer_auth_user
      - pgbouncer_auth_data.query_result[0].passwd is string
      - pgbouncer_auth_data.query_result[0].passwd | length > 0
    fail_msg: >-
      Unable to create userlist.txt: PostgreSQL must return exactly one
      PgBouncer role with a non-empty password hash.
  no_log: true

- name: Write PgBouncer userlist
  ansible.builtin.copy:
    content: |
      "{{ pgbouncer_auth_data.query_result[0].usename }}" "{{ pgbouncer_auth_data.query_result[0].passwd }}"
    dest: /opt/tantor/etc/pgbouncer/userlist.txt
    owner: "postgres"
    group: "pgbouncer"
    mode: "0640"
  notify: Restart pgbouncer-tantor
  no_log: true

- name: Upload pgbouncer_prepare.sql
  become: true
  become_user: root
  with_items:
    - f: "{{ playbook_dir + '/roles/pgbouncer/sql/pgbouncer_prepare.sql' }}"
      d: '/opt/tantor/etc/pgbouncer'
      m: '0400'
  ansible.builtin.copy:
    src: '{{ item.f }}'
    dest: '{{ item.d }}'
    owner: "postgres"
    group: postgres
    mode: '{{ item.m }}'

- name: Create pgbouncer namespace
  vars:
    ansible_python_interpreter: "/opt/tantor/usr/bin/python3"
  community.postgresql.postgresql_script:
    db: postgres
    path: /opt/tantor/etc/pgbouncer/pgbouncer_prepare.sql
  changed_when: false
  when: pgbouncer_psql_node_status.stdout == 'f'

- name: Remove legacy PgBouncer systemd override
  ansible.builtin.file:
    path: /etc/systemd/system/pgbouncer-tantor.service
    state: absent
  notify: Restart pgbouncer-tantor

- name: Remove legacy PgBouncer tmpfiles override
  ansible.builtin.file:
    path: /etc/tmpfiles.d/pgbouncer-tantor.conf
    state: absent
