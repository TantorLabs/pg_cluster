---
- name: Populate service facts
  ansible.builtin.service_facts:

- name: Installation block
  when: postgresql_vendor == 'classic'
  block:
    - name: Prerequisite block
      block:
        - name: Add Epel repository
          ansible.builtin.package:
            name:
              - epel-release
          when: (ansible_facts.distribution == "Rocky") or (ansible_facts.distribution == "CentOS")

        - name: Do system update (apt)
          ansible.builtin.apt:
            update_cache: true
            upgrade: true
          when: (ansible_facts.pkg_mgr == 'apt')
          changed_when: false

        - name: Do system update (yum)
          ansible.builtin.dnf:
            update_cache: true
          when: (ansible_facts.pkg_mgr == 'yum')
          changed_when: false

        - name: Do system update (dnf)
          ansible.builtin.dnf:
            update_cache: true
          when: (ansible_facts.pkg_mgr == 'dnf')
          changed_when: false

        - name: Do system update (apt_rpm)
          community.general.apt_rpm:
            update_cache: true
          when: (ansible_facts.pkg_mgr == 'apt_rpm')
          changed_when: false

        - name: Install prerequisite packages
          ansible.builtin.package:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - gpg
              - locales
              - lsb-release
              - software-properties-common
              - telnet
              - python3-pip
              - python3-psycopg2
              - sudo
              - virtualenv
              - python3-setuptools
              - wget
              - acl
              - lsb-release
            state: present
          when: ansible_facts.pkg_mgr == 'apt'

        - name: Install prerequisite packages (yum)
          ansible.builtin.package:
            name:
              - ca-certificates
              - curl
              - gnupg
              - gpg
              - telnet
              - python3-pip
              - python3-psycopg2
              - python3-setuptools
              - wget
              - acl
            state: present
          when: ansible_facts.pkg_mgr == 'yum' or ansible_facts.pkg_mgr == 'dnf'

        - name: Install prerequisite packages (apt_rpm)
          ansible.builtin.package:
            name:
              - ca-certificates
              - curl
              - gnupg
              - gpg
              - telnet
              - python3
              - python3-module-pip
              - python3-module-psycopg2
              - apt-https
              - python3-module-setuptools
              - wget
              - acl
            state: present
          when: ansible_facts.pkg_mgr == 'apt_rpm'

        - name: Disable firewalld for Rocky-8
          ansible.builtin.service:
            state: stopped
            name: firewalld
          when:
            - ansible_facts['os_family'] == "RedHat"
            - ansible_facts.distribution == "Rocky"
            - ansible_facts.distribution_major_version == "8"

    - name: Block for Debian and Ubuntu
      when: (ansible_facts['os_family'] == "Debian") or (ansible_facts['os_family'] == "Ubuntu")
      block:
        - name: Get system release (Debian)
          ansible.builtin.command:
            cmd: lsb_release -cs
          register: postgres_classic_debian_release
          changed_when: false
          failed_when: postgres_classic_debian_release.rc != 0

        - name: Ensure APT keyrings directory exists (Debian)
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download PostgreSQL repository key (Debian)
          ansible.builtin.get_url:
            url: "{{ postgresql_debian_gpg_key }}"
            dest: /etc/apt/keyrings/postgresql-classic.asc
            mode: "0644"
          register: postgres_classic_key_download_debian

        - name: Check binary PostgreSQL repository key (Debian)
          ansible.builtin.stat:
            path: /etc/apt/keyrings/postgresql-classic.gpg
          register: postgres_classic_key_gpg_debian

        - name: Convert PostgreSQL repository key to binary format (Debian)
          ansible.builtin.command:
            cmd: gpg --dearmor --yes -o /etc/apt/keyrings/postgresql-classic.gpg /etc/apt/keyrings/postgresql-classic.asc
          changed_when: true
          when: postgres_classic_key_download_debian is changed or not postgres_classic_key_gpg_debian.stat.exists

        - name: Add PostgreSQL repo (Debian)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/postgresql-classic.list
            content: >
              deb [signed-by=/etc/apt/keyrings/postgresql-classic.gpg]
              https://apt.postgresql.org/pub/repos/apt {{ postgres_classic_debian_release.stdout }}-pgdg main
            mode: "0644"
          register: postgres_classic_repo_debian

        - name: Update APT cache (Debian)
          ansible.builtin.apt:
            update_cache: true
          register: postgres_classic_apt_update_debian
          until: postgres_classic_apt_update_debian is succeeded
          retries: 5
          delay: 5
          when: postgres_classic_repo_debian is changed

        - name: Install postgresql-server (Debian)
          # libpq-dev is intentionally not installed here: python3-psycopg2
          # (installed below) already provides the libpq binding for Ansible.
          ansible.builtin.package:
            name:
              - postgresql-{{ major_version }}
              - postgresql-contrib
              - python3-psycopg2
            state: present

    - name: Block for Centos-7 , RedOS , Rocky
      when: ansible_facts.distribution in ["CentOS", "RED", "Rocky"]
      block:
        - name: "Setting up PostgreSQL repository (yum)"
          ansible.builtin.dnf:
            name: >-
              https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_facts.distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
            state: present
            disable_gpg_check: true
          when: (ansible_facts.pkg_mgr == 'yum')

        - name: "Setting up PostgreSQL repository (dnf)"
          ansible.builtin.dnf:
            name: >-
              https://download.postgresql.org/pub/repos/yum/reporpms/EL-{{ ansible_facts.distribution_major_version }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
            state: present
            disable_gpg_check: true
          when: (ansible_facts.pkg_mgr == 'dnf')

        - name: "Fix repolist for RedOS"
          ansible.builtin.replace:
            path: /etc/yum.repos.d/pgdg-redhat-all.repo
            regexp: 'rhel-\$releasever'
            replace: "rhel-{{ ansible_facts.distribution_version }}"
          when: (ansible_facts.distribution == "RED")

        - name: Check enabled modules for Rocky linux
          ansible.builtin.command:
            cmd: dnf -qy module list --enabled
          changed_when: false
          register: postgres_classic_rocky_enabled_modules
          when: ( ansible_facts.distribution == "Rocky" )

        - name: Disable postgresql module at Rocky linux
          ansible.builtin.command:
            cmd: dnf -qy module disable postgresql
          when:
            - ansible_facts.distribution == "Rocky"
            - ("postgresql" in postgres_classic_rocky_enabled_modules.stdout)
          changed_when: ("postgresql" in postgres_classic_rocky_enabled_modules.stdout)

        - name: Install PostgreSQL
          ansible.builtin.package:
            name:
              - postgresql{{ major_version }}-server
              - postgresql{{ major_version }}-contrib
              - postgresql-libs
              - python3-psycopg2
            state: present

        - name: Install PostgreSQL extentions
          ansible.builtin.package:
            name:
              - pg_stat_monitor_{{ major_version }}
            state: present
          when: (ansible_facts.distribution == "Rocky")

    - name: Block for Astra Linux (Smolensk and Orel)
      when: (ansible_facts['os_family'] == "Astra Linux") or (ansible_facts['os_family'] == "Astra Linux (Orel)")
      block:
        - name: Ensure APT keyrings directory exists (Astra)
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download PostgreSQL repository key (Astra)
          ansible.builtin.get_url:
            url: "{{ postgresql_debian_gpg_key }}"
            dest: /etc/apt/keyrings/postgresql-classic.asc
            mode: "0644"
            validate_certs: false
          register: postgres_classic_key_download_astra

        - name: Check binary PostgreSQL repository key (Astra)
          ansible.builtin.stat:
            path: /etc/apt/keyrings/postgresql-classic.gpg
          register: postgres_classic_key_gpg_astra

        - name: Convert PostgreSQL repository key to binary format (Astra)
          ansible.builtin.command:
            cmd: gpg --dearmor --yes -o /etc/apt/keyrings/postgresql-classic.gpg /etc/apt/keyrings/postgresql-classic.asc
          changed_when: true
          when: postgres_classic_key_download_astra is changed or not postgres_classic_key_gpg_astra.stat.exists

        - name: Add PostgreSQL repo (Astra)
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/postgresql-classic.list
            content: >
              deb [signed-by=/etc/apt/keyrings/postgresql-classic.gpg]
              https://apt.postgresql.org/pub/repos/apt buster-pgdg main
            mode: "0644"
          register: postgres_classic_repo_astra

        - name: Update APT cache (Astra)
          ansible.builtin.apt:
            update_cache: true
          register: postgres_classic_apt_update_astra
          until: postgres_classic_apt_update_astra is succeeded
          retries: 5
          delay: 5
          when: postgres_classic_repo_astra is changed

        - name: Check for psycopg2 packages in the OS (Astra)
          ansible.builtin.command:
            cmd: "apt-cache show {{ item }}"
          loop:
            - python3-psycopg2
            - python3-module-psycopg2
            - python-psycopg2
          register: postgres_classic_psycopg2_apt_check
          changed_when: false
          failed_when: false

        - name: Set psycopg2 availability fact (Astra)
          # A package counts as present only when apt-cache show succeeds AND
          # prints a record: with empty apt lists apt-cache may return rc=0
          # while producing no output at all.
          ansible.builtin.set_fact:
            postgres_classic_psycopg2_in_os: >-
              {{ postgres_classic_psycopg2_apt_check.results
                 | selectattr('rc', 'equalto', 0)
                 | rejectattr('stdout', 'equalto', '')
                 | list | length > 0 }}

        - name: Install postgresql-server (Astra)
          ansible.builtin.package:
            name:
              - postgresql-{{ major_version }}
              - postgresql-contrib
            state: present

        # libpq-dev is a build-time dependency and is installed only when
        # the OS provides no psycopg2 package (python3-psycopg2 or similar).
        - name: Install libpq-dev when no psycopg2 package in OS (Astra)
          ansible.builtin.package:
            name:
              - libpq-dev
            state: present
          when: not postgres_classic_psycopg2_in_os

    - name: Block for AltLinux
      when: (ansible_facts['os_family'] == "Altlinux")
      block:
        - name: Install postgresql repo
          community.general.apt_rpm:
            pkg: "https://download.postgresql.org/pub/repos/yum/reporpms/EL-8-x86_64/pgdg-redhat-repo-latest.noarch.rpm"
            state: present

        - name: Install PostgreSQL
          ansible.builtin.package:
            name:
              - postgresql{{ major_version }}-server
              - postgresql{{ major_version }}-contrib
              - python3-module-psycopg2
            state: present

        - name: Create a /var/run/postgresql directory if it does not exist
          ansible.builtin.file:
            path: /var/run/postgresql
            state: directory
            mode: '0755'
            owner: postgres
            group: postgres

    - name: Block for Cleanup for Debian-like systems
      when: (ansible_facts['os_family'] == "Astra Linux") or
            (ansible_facts['os_family'] == "Astra Linux (Orel)") or
            (ansible_facts['os_family'] == "Debian")
      block:
        - name: Stop Postgresql service
          ansible.builtin.service:
            name: postgresql@{{ major_version }}-main
            state: stopped

        # - name: Remove cluster data folders
        #   ansible.builtin.file:
        #     cmd: |
        #       rm -rf /var/lib/postgresql/*
        #       rm -rf /etc/postgresql/*

        - name: Remove cluster data folders
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          with_items:
            - "/var/lib/postgresql/"
            - "/etc/postgresql/"
          when:
            - (ansible_facts.services['patroni-tantor.service']['state'] | d()) != 'running'
            - ('patroni-tantor.service' not in ansible_facts.services)

        - name: Create cluster data folders
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: postgres
            group: postgres
            mode: "0755"
          with_items:
            - "/var/lib/postgresql/"
            - "/etc/postgresql/"
