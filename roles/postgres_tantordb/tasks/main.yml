---
- name: Validate TantorDB package parameters
  ansible.builtin.assert:
    that:
      - (major_version | string) is match('^[0-9]+$')
      - edition is string
      - edition is match('^[a-z0-9][a-z0-9-]*$')
      - tantordb_package_version | default('') is string
      - tantordb_package_version | default('') is not search('\\s')
      - ansible_facts.pkg_mgr in ['apt', 'apt_rpm', 'dnf', 'yum', 'zypper']
    fail_msg: >-
      Invalid TantorDB package parameters. major_version must be numeric,
      edition must contain lowercase letters, digits or hyphens, and
      tantordb_package_version must be a package version without whitespace.
  when: postgresql_vendor == 'tantordb'

- name: Build TantorDB package specification
  ansible.builtin.set_fact:
    postgres_tantordb_package_name: "tantor-{{ edition }}-server-{{ major_version }}"
    postgres_tantordb_package_spec: >-
      {{ 'tantor-' ~ edition ~ '-server-' ~ major_version ~
         (('=' if ansible_facts.pkg_mgr == 'apt' else '-') ~ tantordb_package_version
          if tantordb_package_version | default('') | length > 0 else '') }}
    postgres_tantordb_zypper_package_spec: >-
      {{ 'tantor-' ~ edition ~ '-server-' ~ major_version ~
         ('=' ~ tantordb_package_version
          if tantordb_package_version | default('') | length > 0 else '') }}
  when: postgresql_vendor == 'tantordb'

- name: Install TantorDB server (Debian package)
  ansible.builtin.apt:
    name: "{{ postgres_tantordb_package_spec }}"
    state: present
    allow_downgrade: true
  when:
    - postgresql_vendor == 'tantordb'
    - ansible_facts.pkg_mgr == 'apt'

- name: Ensure PostgreSQL user has MIC level 63 on Astra Linux
  when: ansible_facts.os_family == "Astra Linux"
  block:
    - name: Check if MIC is enabled
      ansible.builtin.command: astra-mic-control status
      register: mic_status_result
      changed_when: false
      failed_when: mic_status_result.rc != 0 and mic_status_result.rc != 1

    - name: Normalize MIC status output
      ansible.builtin.set_fact:
        mic_normalized: >-
          {{ ((mic_status_result.stdout | default('')) + (mic_status_result.stderr | default(''))) | lower }}

    - name: Compute effective MIC active status (SAFE MODE)
      ansible.builtin.set_fact:
        mic_is_active: >-
          {{ not (mic_normalized is search('неактивно|disabled|off|выключен|stopped')) }}

    - name: Manage MIC rights for postgres user
      when: mic_is_active | bool
      block:
        - name: Get current MIC level for postgres user
          ansible.builtin.command: pdpl-user postgres
          register: current_mic_level
          changed_when: false
          failed_when: current_mic_level.rc != 0
          when: mic_is_active | bool

        - name: Determine if MIC level 63 is already set
          ansible.builtin.set_fact:
            mic_level_is_63: >-
              {{ (current_mic_level.stdout | default('')) is search('0:63:', ignorecase=true) }}
          when:
            - mic_is_active | bool
            - current_mic_level is success

        - name: Grant MIC level 63 to postgres user if missing
          ansible.builtin.command: pdpl-user -i 63 postgres
          when:
            - mic_is_active | bool
            - current_mic_level is success
            - not mic_level_is_63
          register: pdpl_result
          changed_when: pdpl_result.rc == 0 and not mic_level_is_63
          failed_when: pdpl_result.rc != 0

- name: Install TantorDB server (RPM package)
  ansible.builtin.dnf:
    name: "{{ postgres_tantordb_package_spec }}"
    state: present
    allow_downgrade: true
  when:
    - postgresql_vendor == 'tantordb'
    - ansible_facts.pkg_mgr in ['dnf', 'yum']

- name: Install TantorDB server (ALT RPM package)
  community.general.apt_rpm:
    name: "{{ postgres_tantordb_package_spec }}"
    state: present
  when:
    - postgresql_vendor == 'tantordb'
    - ansible_facts.pkg_mgr == 'apt_rpm'

- name: Install TantorDB server (MosOS)
  community.general.zypper:
    name: "{{ postgres_tantordb_zypper_package_spec }}"
    state: present
    force_resolution: true
  when:
    - postgresql_vendor == 'tantordb'
    - ansible_facts.pkg_mgr == 'zypper'
