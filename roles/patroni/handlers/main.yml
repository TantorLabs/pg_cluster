---
- name: Restart patroni-watchdog
  ansible.builtin.systemd_service:
    name: patroni-watchdog
    state: restarted
    daemon_reload: true
    enabled: true

- name: Restart patroni
  ansible.builtin.systemd_service:
    name: "{{ patroni_package_name }}.service"
    state: restarted
    daemon_reload: true
    enabled: true
