---
- name: Block for checking if hostnames are valid
  block:
    - name: Gather inventory hostnames from all hosts
      ansible.builtin.set_fact:
        prepare_nodes_all_inventory_names: "{{ groups['all'] }}"
      run_once: true

    - name: Extract domain part and count domain levels
      ansible.builtin.set_fact:
        prepare_nodes_domain_part: "{{ inventory_hostname | regex_replace('^[^.]+\\.?', '') }}"
        prepare_nodes_domain_levels: "{{ (inventory_hostname | regex_replace('^[^.]+\\.?', '')).split('.') | length if '.' in inventory_hostname else 0 }}"
        prepare_nodes_has_domain: "{{ '.' in inventory_hostname }}"

    - name: Collect domain information from all hosts
      ansible.builtin.set_fact:
        prepare_nodes_all_domain_parts: "{{ ansible_play_hosts | map('extract', hostvars, 'prepare_nodes_domain_part') | list }}"
        prepare_nodes_all_domain_levels: "{{ ansible_play_hosts | map('extract', hostvars, 'prepare_nodes_domain_levels') | list }}"
        prepare_nodes_all_has_domain: "{{ ansible_play_hosts | map('extract', hostvars, 'prepare_nodes_has_domain') | list }}"
      run_once: true

    - name: Check consistency of naming convention
      ansible.builtin.fail:
        msg: |
          Inconsistent inventory naming detected!
          All hosts must have the same domain structure (same number of domain levels).
          Current hosts analysis:
          {% for host in ansible_play_hosts %}
          - {{ host }}: {{ 'no domain' if not hostvars[host]['prepare_nodes_has_domain']
              else hostvars[host]['prepare_nodes_domain_levels']|string + ' domain levels (' +
              hostvars[host]['prepare_nodes_domain_part'] + ')' }}
          {% endfor %}

          Issues found:
          {% if prepare_nodes_all_has_domain | unique | length > 1 %}
          - Mixed hostname formats: some have domains, others don't
          {% endif %}
          {% if prepare_nodes_all_domain_levels | unique | length > 1 %}
          - Different domain levels: {{ prepare_nodes_all_domain_levels | unique | sort }}
          {% endif %}

          Please ensure all hosts follow the same naming convention.
      when:
        - (prepare_nodes_all_has_domain | unique | length > 1) or (prepare_nodes_all_domain_levels | unique | length > 1)
      run_once: true

    # unified_hostname is intentionally unprefixed: it's a shared, inventory-overridable
    # variable read by the etcd role's tasks/templates and group_vars/etcd.yml.
    - name: Set unified hostname variable for FQDN inventory  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        unified_hostname: "{{ ansible_facts.fqdn }}"
        cacheable: true
      when: prepare_nodes_has_domain

    - name: Set unified hostname variable for hostname-only inventory  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        unified_hostname: "{{ inventory_hostname }}"
        cacheable: true
      when: not prepare_nodes_has_domain

- name: "Configure hostname"
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true

- name: Block for installation of basic utils
  module_defaults:
    ansible.builtin.apt:
      update_cache: true
    ansible.builtin.yum:
      update_cache: true
    ansible.builtin.dnf:
      update_cache: true
    community.general.apt_rpm:
      update_cache: true
  block:
    - name: Install basic utils
      ansible.builtin.package:
        name:
          - jq
          - chrony
          - curl
        state: present
      notify: Restart chronyd

- name: Include task for Debian-like systems
  ansible.builtin.include_tasks: debian.yml
  when: ansible_facts.os_family in ["Astra Linux", "Debian", "Altlinux"]

- name: Include task for RHEL-like systems
  ansible.builtin.include_tasks: rhel.yml
  when: ansible_facts.os_family in ["RED", "Centos", "Rocky", "RedHat"]

- name: Get content of /etc/security/limits.conf file
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    regexp: '(postgres\shard)|(postgres\ssoft)'
    state: absent
  check_mode: true
  register: prepare_nodes_sec_limit
  changed_when: false

- name: Add secure limits for postgres if not exists
  ansible.builtin.lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    state: present
  when: not prepare_nodes_sec_limit.found
  with_items:
    - "postgres soft    nofile   65536"
    - "postgres hard    nofile   100000"

- name: Add another bin dir to system-wide $PATH.
  when: ansible_facts.env.PATH is not search("/opt/tantor/usr/bin:/opt/tantor/usr/sbin")
  ansible.builtin.copy:
    dest: /etc/profile.d/tantor.sh
    content: 'PATH=$PATH:/opt/tantor/usr/bin:/opt/tantor/usr/sbin'
    mode: "0644"
